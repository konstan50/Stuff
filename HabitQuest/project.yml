name: HabitQuest
options:
  bundleIdPrefix: com.andrewkonstand
  deploymentTarget:
    iOS: "17.0"
targets:
  HabitQuest:
    type: application
    platform: iOS
    sources:
      - HabitQuest
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: HabitQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewkonstand.habitquest
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
