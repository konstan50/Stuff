name: HabitQuest
options:
  bundleIdPrefix: com.andrewkonstand
  deploymentTarget:
    iOS: "17.0"
targets:
  HabitQuest:
    type: application
    platform: iOS
    sources:
      - HabitQuest
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: HabitQuest
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Generated/HabitQuest.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: ["iCloud.com.andrewkonstand.habitquest"]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewkonstand.habitquest
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
